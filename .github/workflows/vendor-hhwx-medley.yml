name: Vendor HHWX Medley baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/vendor-hhwx-medley.mjs"
      - ".github/workflows/vendor-hhwx-medley.yml"

permissions:
  contents: write

concurrency:
  group: vendor-hhwx-medley-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vendor pinned Medley compute sources
        run: node scripts/vendor-hhwx-medley.mjs

      - name: Commit vendored sources
        shell: bash
        run: |
          set -euo pipefail
          git add src/lib/bandori/medley-foundation crates/bandori-medley-model crates/bandori-medley-search crates/bandori-medley-reference docs/hhwx-medley-upstream.json
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "HHWX Medley baseline already matches the pinned commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor HHWX Medley optimizer baseline"
          git push origin HEAD:main
