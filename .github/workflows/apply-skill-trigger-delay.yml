name: Apply skill trigger delay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-skill-trigger-delay-patch.mjs"
      - "scripts/verify-skill-trigger-scheduler.mjs"
      - "src/lib/bandori/team-builder/core/skill-trigger-scheduler.ts"
      - ".github/workflows/apply-skill-trigger-delay.yml"

permissions:
  contents: write

concurrency:
  group: skill-trigger-delay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply scheduler-aware scoring patch
        run: node scripts/apply-skill-trigger-delay-patch.mjs
      - name: Verify skill order distribution
        run: npm run test:shuffle
      - name: Verify skill trigger scheduler
        run: npm run test:scheduler
      - name: Build frontend
        run: npm run build:web
      - name: Commit tested scorer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain src/lib/bandori/team-builder/core/scoring.ts)" ]]; then
            echo "Scheduler-aware scoring patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/bandori/team-builder/core/scoring.ts
          git commit -m "Model the 0.75s skill trigger guard window"
          git pull --rebase origin main
          git push origin HEAD:main
