name: Vendor HHWX search baseline

on:
  push:
    branches: [main]
    paths:
      - scripts/vendor-hhwx.mjs
      - scripts/apply-real-skill-shuffle.mjs
      - scripts/apply-skill-trigger-delay-patch.mjs
      - scripts/verify-skill-trigger-scheduler.mjs
      - src/lib/bandori/team-builder/core/skill-shuffle.ts
      - src/lib/bandori/team-builder/core/skill-trigger-scheduler.ts
      - .github/workflows/vendor-hhwx.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendor pinned HHWX files
        run: node scripts/vendor-hhwx.mjs
      - name: Apply local real-shuffle patch
        run: node scripts/apply-real-skill-shuffle.mjs
      - name: Apply local trigger-delay patch
        run: node scripts/apply-skill-trigger-delay-patch.mjs
      - name: Install dependencies
        run: npm install
      - name: Verify patched baseline
        run: npm run build
      - name: Commit vendored and patched baseline
        run: |
          if git diff --quiet; then
            echo "Vendored files and local patches are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/bandori-area-item-groups.ts src/lib/bandori-team-calculator.ts src/lib/bandori/team-builder/core src/lib/bandori/team-builder/single
          git commit -m "Apply real weighted skill shuffle and trigger timing"
          git push
