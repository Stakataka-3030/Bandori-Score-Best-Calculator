name: Apply clipboard profile import

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-clipboard-import-patch.mjs"
      - ".github/workflows/apply-clipboard-import.yml"

permissions:
  contents: write

concurrency:
  group: clipboard-profile-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply clipboard import patch
        run: node scripts/apply-clipboard-import-patch.mjs
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Verify frontend and score regressions
        run: npm run build
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify native Tauri integration
        run: npm run tauri:build -- --no-bundle
      - name: Commit tested clipboard import
        shell: bash
        run: |
          set -euo pipefail
          changed_paths=(
            package.json
            src-tauri/Cargo.toml
            src-tauri/capabilities/default.json
            src-tauri/src/lib.rs
            src/App.tsx
            src/styles.css
          )
          if [[ -z "$(git status --porcelain -- "${changed_paths[@]}")" ]]; then
            echo "Clipboard import patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${changed_paths[@]}"
          git commit -m "Import HHWX profile JSON from clipboard"
          git pull --rebase origin main
          git push origin HEAD:main
