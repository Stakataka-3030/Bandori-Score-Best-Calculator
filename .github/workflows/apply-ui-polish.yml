name: Apply UI polish

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-ui-polish.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply requested UI changes
        run: node scripts/apply-ui-polish.mjs
      - name: Verify skill shuffle
        run: npm run test:shuffle
      - name: Build web frontend
        run: npm run build:web
      - name: Commit tested changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Polish calculator UI and temporary card controls"
          git push
