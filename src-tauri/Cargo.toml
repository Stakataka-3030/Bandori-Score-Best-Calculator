[package]
name = "bandori-score-best-calculator"
version = "0.1.0"
description = "Portable Bandori best-team score calculator"
authors = ["Stakataka-3030"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "bandori_score_best_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bandori-medley-search = { path = "../crates/bandori-medley-search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
