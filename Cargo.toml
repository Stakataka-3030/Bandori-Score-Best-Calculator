[workspace]
members = [
  "src-tauri",
  "crates/bandori-medley-model",
  "crates/bandori-medley-reference",
  "crates/bandori-medley-search",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/Stakataka-3030/Bandori-Score-Best-Calculator"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
